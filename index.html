<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uheng Operations Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;background:#f5f5f5;color:#1a1a1a}
#loginPage{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-card{background:#fff;border-radius:12px;border:1px solid #e0e0e0;padding:2.5rem;width:340px;text-align:center}
.login-logo{font-size:32px;margin-bottom:8px}
.login-title{font-size:17px;font-weight:600;margin-bottom:4px}
.login-sub{font-size:12px;color:#999;margin-bottom:1.5rem}
#pwInput{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-bottom:10px;text-align:center;outline:none}
#pwInput:focus{border-color:#378ADD}
.login-btn{width:100%;padding:10px;background:#1a1a1a;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer}
.login-btn:hover{background:#333}
#loginErr{color:#c0392b;font-size:12px;margin-top:10px;display:none}
#app{display:none;padding:16px;max-width:1300px;margin:0 auto}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.hdr h1{font-size:15px;font-weight:600}
.hdr p{font-size:11px;color:#999;margin-top:2px}
.hdr-right{display:flex;gap:8px;align-items:center}
.btn{font-size:12px;padding:5px 12px;border-radius:8px;border:1px solid #ddd;background:#fff;cursor:pointer;color:#333}
.btn:hover{background:#f5f5f5}
.btn-out{color:#c0392b;border-color:#f5c6c6}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.metric{background:#fff;border:1px solid #ebebeb;border-radius:10px;padding:12px 14px}
.metric .lbl{font-size:11px;color:#999;margin-bottom:3px}
.metric .val{font-size:22px;font-weight:600}
.val-warn{color:#854F0B}
.val-ok{color:#0F6E56}
.filters{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
select{font-size:12px;padding:5px 8px;border-radius:8px;border:1px solid #ddd;background:#fff;color:#333}
.banner{background:#EBF4FF;border:1px solid #B5D4F4;border-radius:8px;padding:8px 14px;margin-bottom:10px;font-size:12px;color:#185FA5}
.tbl-wrap{background:#fff;border:1px solid #ebebeb;border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;font-size:11px;color:#999;padding:8px 12px;border-bottom:1px solid #f0f0f0;background:#fafafa;white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid #f5f5f5;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}
.so{font-weight:600;font-size:12px}
.client{font-size:12px}
.note{font-size:10px;color:#aaa;margin-top:2px}
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;font-weight:500}
.b-uh{background:#E6F1FB;color:#185FA5}
.b-sg{background:#EEEDFE;color:#534AB7}
.steps-row{display:flex;align-items:center;gap:0}
.step-wrap{display:flex;align-items:center;gap:0}
.step-btn{width:28px;height:28px;border-radius:50%;border:1.5px solid #ddd;background:#fff;cursor:pointer;font-size:11px;font-weight:500;color:#bbb;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;user-select:none}
.step-btn:hover{border-color:#378ADD;color:#378ADD;transform:scale(1.1)}
.step-btn.done{background:#1D9E75;border-color:#1D9E75;color:#fff}
.step-line{width:30px;height:2px;background:#eee;flex-shrink:0}
.step-line.done{background:#1D9E75}
.step-lbl{font-size:9px;color:#bbb;text-align:center;margin-top:2px}
.step-lbl.done{color:#1D9E75}
.step-col{display:flex;flex-direction:column;align-items:center}
.fid{font-size:11px;color:#aaa}
.fid-warn{color:#854F0B;font-weight:600}
.fid-over{color:#c0392b;font-weight:600}
.updated{font-size:10px;color:#ccc;margin-top:2px}
.empty{text-align:center;padding:2.5rem;color:#aaa}
</style>
</head>
<body>

<div id="loginPage">
  <div class="login-card">
    <div class="login-logo">📦</div>
    <div class="login-title">Uheng Operations</div>
    <div class="login-sub">Delivery & Installation Dashboard</div>
    <input type="password" id="pwInput" placeholder="输入密码" onkeydown="if(event.key==='Enter')login()">
    <button class="login-btn" onclick="login()">进入 →</button>
    <div id="loginErr">⚠ 密码错误，请重试</div>
  </div>
</div>

<div id="app">
  <div class="hdr">
    <div>
      <h1>Operations Dashboard</h1>
      <p id="syncTime">—</p>
    </div>
    <div class="hdr-right">
      <button class="btn" onclick="loadData()">↻ 刷新</button>
      <button class="btn btn-out" onclick="logout()">退出</button>
    </div>
  </div>

  <div id="banner" class="banner" style="display:none"></div>

  <div class="metrics">
    <div class="metric"><div class="lbl">总 Jobs</div><div class="val" id="mTotal">0</div></div>
    <div class="metric"><div class="lbl">备货中</div><div class="val val-warn" id="m0">0</div></div>
    <div class="metric"><div class="lbl">待出货</div><div class="val val-warn" id="m1">0</div></div>
    <div class="metric"><div class="lbl">安装中</div><div class="val val-warn" id="m2">0</div></div>
    <div class="metric"><div class="lbl">完工</div><div class="val val-ok" id="m3">0</div></div>
  </div>

  <div class="filters">
    <select id="fWeek" onchange="renderTable()">
      <option value="all">所有日期</option>
      <option value="this">本周</option>
      <option value="next">下周</option>
    </select>
    <select id="fType" onchange="renderTable()">
      <option value="all">所有类型</option>
      <option value="UH">UH (MY)</option>
      <option value="TR">TR (SG)</option>
    </select>
    <select id="fStage" onchange="renderTable()">
      <option value="all">所有阶段</option>
      <option value="0">备货中</option>
      <option value="1">待出货</option>
      <option value="2">安装中</option>
      <option value="3">完工</option>
    </select>
  </div>

  <div class="tbl-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:155px">SO / 客户</th>
          <th style="width:85px">出货日</th>
          <th style="width:60px">类型</th>
          <th style="width:70px">Subcon</th>
          <th>进度（点击更新）</th>
          <th style="width:85px">FID</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
const PW = 'uheng2026';
const TODAY = new Date().toISOString().split('T')[0];
const LABELS = ['备货','出货','安装','完工'];

const JOBS = [
  {id:'q82rd29b68lp82ccpa4ap8dcic',so:'MLSO260040',client:'Tan Jun Quan',type:'UH',sub:'Guang',date:'2026-05-04',fid:'25/5/2026',note:'Batch 1 — Kitchen + Master Bedroom',noInst:false},
  {id:'86jdm9pthvpf35bimi3ia15vtk',so:'SO2600112',client:'HOMLUX INTERIOR',type:'UH',sub:'Guang',date:'2026-05-07',fid:'TBC',note:'',noInst:false},
  {id:'p0kve30ps6phg4mfa0es2gan6o',so:'MLSO260035',client:'Goh Kwee Hwa',type:'UH',sub:'5.1',date:'2026-05-09',fid:'4/6/2026',note:'Batch 1 — Kitchen + TV Room',noInst:false},
  {id:'dbfi1bi54nhqj9kptf6e9ts1v4',so:'SO2600137',client:'SIS SPEEDY',type:'UH',sub:'206',date:'2026-05-11',fid:'N/A',note:'',noInst:false},
  {id:'kjghd38qjpf89flmidbt95q4h8',so:'MLSO260040',client:'Tan Jun Quan',type:'UH',sub:'Guang',date:'2026-05-11',fid:'25/5/2026',note:'Batch 2 — Living Hall',noInst:false},
  {id:'ojvtn5em2r28l11fol23nmvhr0',so:'SO2600106',client:'V.S. INDUSTRY',type:'UH',sub:'Yut',date:'2026-05-11',fid:'N/A',note:'Batch 2 — Item 11-20',noInst:false},
  {id:'a93sscv88gg25qr7k09e9sp1i8',so:'MLSO260035',client:'Goh Kwee Hwa',type:'UH',sub:'5.3',date:'2026-05-12',fid:'4/6/2026',note:'Batch 2 — Master Bedroom',noInst:false},
  {id:'u6k69nm1fle3gdrlb119cm3u0o',so:'SO2600142',client:'V.S. INDUSTRY',type:'UH',sub:'Rey',date:'2026-05-12',fid:'12/05/2026',note:'',noInst:false},
  {id:'8f0fu1qtjab1lhh3flq6r1bknc',so:'MLSO260035',client:'Goh Kwee Hwa',type:'UH',sub:'Guang+5.3',date:'2026-05-13',fid:'4/6/2026',note:'Batch 3 — Bedrooms+Living',noInst:false},
  {id:'qunjl47c132hiqejq1ivj0cs9s',so:'SO2600149',client:'CHEN PROJECTS',type:'UH',sub:'—',date:'2026-05-13',fid:'13/05/2026',note:'',noInst:true},
  {id:'mivsfc71m27ovhml0eihnug5hg',so:'SO2600148',client:'DENIKKO CONSTRUCT',type:'TR',sub:'Yut+Kiao',date:'2026-05-14',fid:'15/05/2026',note:'ETD SG: 15/05',noInst:true},
  {id:'4pek4v3o9i26p7klpd2rhfnfbg',so:'MLSO260035',client:'Goh Kwee Hwa',type:'UH',sub:'Guang',date:'2026-05-15',fid:'4/6/2026',note:'Batch 4 — Dressing Room',noInst:false},
  {id:'vihes6na2rilfch3bqvb5hfhb8',so:'SO2600147',client:'SENCONIX',type:'UH',sub:'Zam',date:'2026-05-15',fid:'15/05/2026',note:'',noInst:false},
  {id:'n2g17o90i0rcegbve1psm54nmk',so:'MLSO260035',client:'Goh Kwee Hwa',type:'UH',sub:'5.3',date:'2026-05-16',fid:'4/6/2026',note:'Batch 5 — Porch & Foyer',noInst:false},
  {id:'eo265jvo8plf56udboun7ekifk',so:'SO2600154',client:'HOMLUX INTERIOR',type:'UH',sub:'Driver',date:'2026-05-19',fid:'19/05/2026',note:'',noInst:true},
  {id:'54df6t6qvkjudoedjvq4fa1960',so:'SO2600155',client:'FURNITURE REPUBLIC',type:'TR',sub:'—',date:'2026-05-20',fid:'N/A',note:'',noInst:true},
  {id:'pfa99iv0k1hcdo8nubn20gscdo',so:'SO2600156',client:'FURNITURE REPUBLIC',type:'TR',sub:'—',date:'2026-05-20',fid:'N/A',note:'',noInst:true},
  {id:'sl4fev8cumi3f818vgg6tqk0u8',so:'SO2600153',client:'SUNWAY MARKETING',type:'UH',sub:'Yut',date:'2026-05-20',fid:'20/05/2026',note:'',noInst:false},
  {id:'93n8af3nfeovqsmml1gv4cclno',so:'SO2600151',client:'EPOS AI',type:'UH',sub:'Zam',date:'2026-05-22',fid:'22/05/2026',note:'',noInst:false},
  {id:'i2p4tvmc4po4iln11fl44718j0',so:'SO2600152',client:'E&O SERVICES',type:'UH',sub:'Zam',date:'2026-05-22',fid:'22/05/2026',note:'',noInst:false},
];

let progress = {};

function login() {
  const v = document.getElementById('pwInput').value;
  if (v === PW) {
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadData();
  } else {
    document.getElementById('loginErr').style.display = 'block';
    document.getElementById('pwInput').value = '';
  }
}

function logout() {
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('pwInput').value = '';
}

function loadData() {
  try { progress = JSON.parse(localStorage.getItem('uheng_p') || '{}'); } catch(e) { progress = {}; }
  const now = new Date().toLocaleString('zh-MY', {timeZone:'Asia/Kuala_Lumpur',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
  document.getElementById('syncTime').textContent = '更新于 ' + now;
  renderAll();
}

function save(id, step) {
  const now = new Date().toLocaleString('zh-MY', {timeZone:'Asia/Kuala_Lumpur'});
  progress[id] = {step, at: now};
  try { localStorage.setItem('uheng_p', JSON.stringify(progress)); } catch(e) {}
  renderAll();
}

function getStep(id) {
  if (progress[id] !== undefined) return progress[id].step;
  return JOBS.find(j => j.id === id)?.date < TODAY ? 1 : 0;
}

function getFidClass(fid) {
  if (!fid || ['—','TBC','N/A'].includes(fid)) return '';
  const p = fid.split('/');
  if (p.length === 3) {
    const d = new Date(+p[2], +p[1]-1, +p[0]);
    const diff = (d - new Date()) / 86400000;
    if (diff < 0) return 'fid-over';
    if (diff <= 7) return 'fid-warn';
  }
  return '';
}

function weekRange(off) {
  const d = new Date(), day = d.getDay();
  const mon = new Date(d);
  mon.setDate(d.getDate() - (day===0?6:day-1) + off*7);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  return [mon.toISOString().split('T')[0], sun.toISOString().split('T')[0]];
}

function renderAll() {
  document.getElementById('mTotal').textContent = JOBS.length;
  for (let i = 0; i < 4; i++) {
    document.getElementById('m'+i).textContent = JOBS.filter(j => getStep(j.id) === i).length;
  }
  const todayJobs = JOBS.filter(j => j.date === TODAY);
  const banner = document.getElementById('banner');
  if (todayJobs.length) {
    banner.style.display = 'block';
    banner.textContent = '🚚 今日出货 ' + todayJobs.length + ' 单：' + todayJobs.map(j=>j.so).join('、');
  } else {
    banner.style.display = 'none';
  }
  renderTable();
}

function renderTable() {
  const week = document.getElementById('fWeek').value;
  const type = document.getElementById('fType').value;
  const stage = document.getElementById('fStage').value;

  let list = JOBS.filter(j => {
    if (type !== 'all' && j.type !== type) return false;
    if (stage !== 'all' && getStep(j.id) !== +stage) return false;
    if (week === 'this') { const [a,b]=weekRange(0); if(j.date<a||j.date>b) return false; }
    if (week === 'next') { const [a,b]=weekRange(1); if(j.date<a||j.date>b) return false; }
    return true;
  });

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  if (!list.length) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 6; td.className = 'empty'; td.textContent = '没有符合条件的 job';
    tr.appendChild(td); tbody.appendChild(tr);
    return;
  }

  list.forEach(j => {
    const step = getStep(j.id);
    const maxStep = j.noInst ? 2 : 3;
    const tr = document.createElement('tr');
    if (j.date < TODAY && step < maxStep) tr.style.background = '#fffbf5';

    // SO / 客户
    const td1 = document.createElement('td');
    td1.innerHTML = '<div class="so">'+j.so+'</div><div class="client">'+j.client+'</div>'+(j.note?'<div class="note">'+j.note+'</div>':'');
    tr.appendChild(td1);

    // 出货日
    const td2 = document.createElement('td');
    td2.innerHTML = '<div style="font-weight:500">'+j.date+'</div>'+(j.date===TODAY?'<span class="badge b-uh" style="margin-top:2px">今日</span>':'');
    tr.appendChild(td2);

    // 类型
    const td3 = document.createElement('td');
    td3.innerHTML = '<span class="badge '+(j.type==='TR'?'b-sg':'b-uh')+'">'+j.type+'</span>';
    tr.appendChild(td3);

    // Subcon
    const td4 = document.createElement('td');
    td4.style.fontSize = '12px';
    td4.textContent = j.sub;
    tr.appendChild(td4);

    // 进度
    const td5 = document.createElement('td');
    const stepsRow = document.createElement('div');
    stepsRow.className = 'steps-row';

    LABELS.forEach((lbl, i) => {
      if (j.noInst && i === 2) return;
      const isDone = step > i;
      const isActive = step === i;

      const col = document.createElement('div');
      col.className = 'step-col';

      const btn = document.createElement('button');
      btn.className = 'step-btn' + (isDone ? ' done' : '');
      btn.textContent = isDone ? '✓' : (i+1);
      btn.title = (isDone ? '撤回 ' : '完成 ') + lbl;

      // 直接绑定事件
      const targetStep = isDone ? i : i + 1;
      btn.addEventListener('click', function() {
        const ns = Math.max(0, Math.min(targetStep, maxStep));
        save(j.id, ns);
      });

      const lblEl = document.createElement('div');
      lblEl.className = 'step-lbl' + (isDone ? ' done' : '');
      lblEl.textContent = lbl;

      col.appendChild(btn);
      col.appendChild(lblEl);
      stepsRow.appendChild(col);

      // 连接线
      if (i < 3 && !(j.noInst && i === 1)) {
        const line = document.createElement('div');
        line.className = 'step-line' + (isDone ? ' done' : '');
        line.style.marginBottom = '14px';
        stepsRow.appendChild(line);
      }
    });

    td5.appendChild(stepsRow);
    tr.appendChild(td5);

    // FID
    const td6 = document.createElement('td');
    const fc = getFidClass(j.fid);
    td6.innerHTML = '<div class="fid '+fc+'">'+j.fid+'</div>';
    if (progress[j.id]) {
      const upd = document.createElement('div');
      upd.className = 'updated';
      upd.textContent = progress[j.id].at;
      td6.appendChild(upd);
    }
    tr.appendChild(td6);

    tbody.appendChild(tr);
  });
}
</script>
</body>
</html>
